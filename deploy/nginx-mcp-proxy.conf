# nginx TLS front end for mcp-proxy.
#
# Install to /etc/nginx/sites-available/mcp-proxy, symlink into
# sites-enabled, then `nginx -t && systemctl reload nginx`.
#
# The three settings that actually matter for SSE are marked CRITICAL. Get
# any of them wrong and the symptom is identical and misleading: the client
# connects, the request appears to succeed, and then nothing ever arrives.

upstream mcp_proxy {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name dbmcp.hookman.online;

    # ACME challenges stay on plaintext; everything else is redirected.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # HTTP/2 is enabled on the listen directive rather than with the newer
    # standalone `http2 on;`. That directive requires nginx >= 1.25.1, and
    # Ubuntu 24.04 LTS — the obvious droplet image — ships 1.24.0, where it
    # fails to start with `unknown directive "http2"`. This form is accepted
    # by every version from 1.9.5 onward.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dbmcp.hookman.online;

    ssl_certificate     /etc/letsencrypt/live/dbmcp.hookman.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dbmcp.hookman.online/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Tenant database credentials travel in request headers, so the transport
    # must be TLS and must not be downgradeable.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Credentials in headers must never reach disk in an access log.
    access_log /var/log/nginx/mcp-proxy.access.log;
    error_log  /var/log/nginx/mcp-proxy.error.log warn;

    location /healthz {
        proxy_pass http://mcp_proxy;
        access_log off;
    }

    location /v1/mcp/ {
        proxy_pass http://mcp_proxy;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CRITICAL 1: nginx buffers upstream responses by default, which holds
        # SSE events until the buffer fills. Events must be forwarded the
        # instant they are written.
        proxy_buffering off;
        proxy_cache off;

        # CRITICAL 2: SSE is chunked, not Content-Length delimited. Without
        # this, nginx may add its own gzip/chunk handling that breaks framing.
        proxy_set_header Connection "";
        chunked_transfer_encoding on;
        gzip off;

        # CRITICAL 3: the default proxy_read_timeout is 60s, so an idle MCP
        # stream is severed after a minute. These streams are long-lived by
        # design and are closed by the client, not by a timer.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # The request body is a single JSON-RPC message; it is never large.
        client_max_body_size 4m;
    }
}
